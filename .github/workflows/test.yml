name: test
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
jobs:
  test:
    # Free on a public repository; private repositories are billed by the minute. Never run there.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vite build
        env:
          SITE_DIR: /tmp/empty-site

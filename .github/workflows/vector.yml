name: vector
# Boundaries (Census TIGERweb), OpenStreetMap buildings and facilities, FEMA flood zones, exposure numbers.
# Runs on the Actions runner (the dev sandbox has no network) and commits into gh-pages:
#   data/geo/**, data/osm/**, data/derived/**, tiles/bld/**
on:
  push:
    branches: [pipe-vector]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vector
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OUT_DIR: ${{ github.workspace }}/out
      WORK_DIR: ${{ github.workspace }}/work
      SITE_DIR: ${{ github.workspace }}/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencies
        run: cd pipeline/vector && npm install --no-audit --no-fund
      - name: Check out gh-pages (blobless, sparse)
        run: |
          git clone -q --filter=blob:none --sparse --single-branch --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "$SITE_DIR"
          git -C "$SITE_DIR" sparse-checkout set data/geo data/osm data/derived tiles/bld
      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: work/cache
          key: vector-cache-v1-${{ github.run_id }}
          restore-keys: vector-cache-v1-
      - name: Stage 1 - boundaries
        run: mkdir -p "$WORK_DIR/cache" "$OUT_DIR" && node pipeline/vector/stage1_boundaries.mjs
      - name: Publish stage 1
        if: ${{ !cancelled() }}
        run: bash pipeline/vector/publish.sh "vector: boundaries (TIGERweb) $(date -u +%FT%TZ)"
      - name: Stage 2 - OSM extract
        if: ${{ !cancelled() && hashFiles('pipeline/vector/stage2_osm.sh') != '' }}
        run: bash pipeline/vector/stage2_osm.sh
      - name: Stage 2-3 - buildings, facilities, elevation
        if: ${{ !cancelled() && hashFiles('pipeline/vector/build.mjs') != '' }}
        run: NO_FLOOD=1 node --max-old-space-size=10000 pipeline/vector/build.mjs
      - name: Publish stage 2-3
        if: ${{ !cancelled() && hashFiles('pipeline/vector/build.mjs') != '' }}
        run: bash pipeline/vector/publish.sh "vector: OSM buildings + facilities with elevation $(date -u +%FT%TZ)" --replace-tiles
      - name: Land-clipped municipios
        if: ${{ !cancelled() && hashFiles('pipeline/vector/land.mjs') != '' }}
        run: node --max-old-space-size=8000 pipeline/vector/land.mjs
      - name: Stage 4 - FEMA NFHL download
        if: ${{ !cancelled() && hashFiles('pipeline/vector/nfhl.mjs') != '' }}
        run: node --max-old-space-size=10000 pipeline/vector/nfhl.mjs
      - name: Save download cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: work/cache
          key: vector-cache-v1-${{ github.run_id }}
      - name: Stage 4 - flood zones attached, exposure
        if: ${{ !cancelled() && hashFiles('pipeline/vector/build.mjs') != '' }}
        run: node --max-old-space-size=10000 pipeline/vector/build.mjs
      - name: Publish stage 4
        if: ${{ !cancelled() }}
        run: bash pipeline/vector/publish.sh "vector: flood zones, exposure, land-clipped municipios $(date -u +%FT%TZ)" --replace-tiles
